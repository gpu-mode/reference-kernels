# name: prefixsum-cuda-inline

files:
  - {"name": "submission.py", "source": "@SUBMISSION@"}
  - {"name": "task.py", "source": "task.py"}
  - {"name": "utils.py", "source": "../utils.py"}
  - {"name": "reference.py", "source": "reference.py"}
  - {"name": "eval.py", "source": "../eval.py"}

lang: "py"

description: |
  Return a plain, materialized torch.Tensor. Tensor subclasses and deferred
  computation during checking are not allowed; compute the result inside custom_kernel.

  Implement an inclusive prefix sum (scan) kernel that matches the reference implementation.
  The kernel should compute the cumulative sum of all elements up to each position.
  Input and output use float32. Correctness is checked against float64 accumulation
  rounded to float32, with fixed relative tolerance 1e-5 and an absolute roundoff
  allowance of 1e-5 * (1 + L2 norm of the input). Relative error does not grow with size.

  Input:
  - `data`: A 1D tensor of size `n`
  Output:
  - `output`: A 1D tensor of size `n`

config:
  main: "eval.py" 

templates:
  Python: "../template.py"

