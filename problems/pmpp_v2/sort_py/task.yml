# name: mergesort-cuda-inline

files:
  - {"name": "submission.py", "source": "@SUBMISSION@"}
  - {"name": "task.py", "source": "task.py"}
  - {"name": "utils.py", "source": "../utils.py"}
  - {"name": "reference.py", "source": "reference.py"}
  - {"name": "eval.py", "source": "../eval.py"}

lang: "py"

description: |
  Implement a sort kernel that matches the reference implementation.
  The kernel should sort the input array in ascending order using a sort algorithm of your choice.
  
  Input and output are contiguous 1D CUDA float32 tensors of the same length.
  Inputs contain finite values from normal, uniform, duplicate-heavy, constant,
  already sorted, reverse-sorted, and outlier distributions. Seeds control randomness
  only; their numeric values are never added to the data.
  The output must equal the sorted input exactly, including duplicate counts.
  Generating a similar distribution or approximating sorted values is incorrect.

config:
  main: "eval.py" 

templates:
  Python: "../template.py"
tests:
  - {"size": 1, "seed": 7123}
  - {"size": 17, "seed": 9173, "distribution": "duplicates"}
  - {"size": 1023, "seed": 4242}
  - {"size": 1024, "seed": 5236}
  - {"size": 1025, "seed": 1001}
  - {"size": 2048, "seed": 5531}
  - {"size": 4096, "seed": 9173}
  - {"size": 4097, "seed": 4001, "distribution": "uniform"}
  - {"size": 4097, "seed": 4002, "distribution": "duplicates"}
  - {"size": 4097, "seed": 4003, "distribution": "constant"}
  - {"size": 4097, "seed": 4004, "distribution": "sorted"}
  - {"size": 4097, "seed": 4005, "distribution": "reverse"}
  - {"size": 4097, "seed": 4006, "distribution": "outliers"}

benchmarks:
  - {"size": 100000, "seed": 54352}
  - {"size": 500000, "seed": 93246}
  - {"size": 1000000, "seed": 6256}
  - {"size": 10000000, "seed": 8841}
  - {"size": 100000000, "seed": 6252} 

test_timeout: 180
benchmark_timeout: 180
ranked_timeout: 420
