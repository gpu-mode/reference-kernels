name: PMPP v2 checker regression tests

on:
  pull_request:
    paths:
      - "problems/pmpp_v2/**"
      - "tests/pmpp_v2/**"
      - ".github/workflows/pmpp-v2-checkers.yml"
  push:
    branches: [main]
    paths:
      - "problems/pmpp_v2/**"
      - "tests/pmpp_v2/**"
      - ".github/workflows/pmpp-v2-checkers.yml"

permissions:
  contents: read

jobs:
  checkers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pytest pyyaml
      - run: python -m pytest -q tests/pmpp_v2
